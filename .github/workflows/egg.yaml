name: React CI/CD

on: push

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: |
          cd react-app
          npm install
          
      - name: Build
        run: |
          cd react-app
          npm run build
          
      - name: Test
        run: |
          cd react-app
          npm test -- --passWithNoTests

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4 # 使用github-pages-deploy-action插件，将build文件夹下的内容部署到gh-pages分支
        with:
          BRANCH: gh-pages # 指定部署的分支，没有这个分支会自动创建
          FOLDER: build # 指定部署的文件夹，默认是build，生成的内容会放在这个文件夹下

