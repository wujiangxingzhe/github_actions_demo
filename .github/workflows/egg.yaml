name: React CI/CD

on: push

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: |
          cd react-app
          npm install
          
      - name: Build
        run: |
          cd react-app
          npm run build
          
      - name: Test
        run: |
          cd react-app
          npm test -- --passWithNoTests