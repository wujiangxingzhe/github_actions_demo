name: React CI/CD

on: push

# fix the issue: The deploy step encountered an error: The process '/usr/bin/git' failed with exit code 128
permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: |
          cd react-app
          npm install
          
      - name: Build
        run: |
          cd react-app
          npm run build
          
      - name: Test
        run: |
          cd react-app
          npm test -- --passWithNoTests

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4 
        # This action automates the deployment of a project to GitHub Pages. 
        # It takes the contents of a specified folder (like 'build' or 'dist') and pushes them to a branch (typically 'gh-pages'). 
        # This branch is then used by GitHub Pages to serve your static website. The action handles all the git commands and deployment steps automatically,
        # making it easy to deploy static websites, documentation, or other web content directly from your GitHub Actions workflow.
        with:
          BRANCH: gh-pages # 指定部署的分支，没有这个分支会自动创建
          FOLDER: react-app/build # 指定部署的文件夹，默认是build，生成的内容会放在这个文件夹下

  push-docker:
    name: Push Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}  # Set this in your repository: Settings > Secrets > Actions > New repository secret
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}  # Set this in your repository: Settings > Secrets > Actions > New repository secret
          # Note: Make sure you're in your repository settings, not your profile settings
          # The path is: Go to your repository > Click Settings tab > Left sidebar "Security" section > "Secrets and variables" > "Actions"

      - name: Build Docker image and push to docker hub
        uses: docker/build-push-action@v3
        with:
          # fix the issue:Error: buildx failed with: ERROR: failed to solve: failed to read dockerfile: open Dockerfile: no such file or directory
          context: ./react-app
          file: ./react-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/react-app:latest
